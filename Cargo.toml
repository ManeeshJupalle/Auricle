[workspace]
resolver = "2"
members = ["crates/auricle-core", "crates/auricle-capture", "crates/auricle-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
auricle-core = { path = "crates/auricle-core" }
auricle-capture = { path = "crates/auricle-capture" }
cpal = "0.18.1"
rtrb = "0.3"
rubato = "0.16"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
