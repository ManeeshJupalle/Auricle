[package]
name = "auricle-core"
description = "Core types and configuration for Auricle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
toml = { workspace = true }

# Windows-only: fall back to the user's persistent environment (HKCU) when a
# key env var isn't in the process environment — `setx` only reaches newly
# spawned terminals, and daemons started from stale shells otherwise report
# keys as missing (recurring real-user papercut).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
