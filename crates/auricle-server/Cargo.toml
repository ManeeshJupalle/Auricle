[package]
name = "auricle-server"
description = "Auricle daemon: axum REST/WS API, SQLite persistence, session engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Explicit include so the prebuilt web UI (ui-dist, produced by `npm run
# build` in ui/ and gitignored) ships inside the published crate.
include = ["src/**", "ui-dist/**", "Cargo.toml"]

[dependencies]
auricle-core = { workspace = true }
auricle-capture = { workspace = true }
auricle-pipeline = { workspace = true }
auricle-stt = { workspace = true }
auricle-llm = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hound = { workspace = true }
futures-util = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
async-trait = { workspace = true }
wiremock = { workspace = true }
