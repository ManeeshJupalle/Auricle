[package]
name = "auricle-overlay"
version = "0.4.1"
description = "Auricle Copilot overlay — always-on-top ask window + tray for the Auricle engine"
edition = "2021"
license = "MIT"
repository = "https://github.com/ManeeshJupalle/Auricle"

# Deliberately its own workspace: the overlay is a pure API client of the
# engine and must not join the engine's cargo workspace (no path deps on
# engine crates — Global Rule: public API only).
[workspace]

[lib]
name = "auricle_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri build` enables this to serve the embedded frontend; a plain
# `cargo build --release` without it produces a devUrl-pointing binary
# that renders a blank window (found the hard way — see the phase report).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "macros", "sync", "io-util"] }

[target.'cfg(windows)'.dependencies]
# Dictation's paste layer and pill: the clipboard and the window that owns
# it, SendInput, window focus, and reading a target's integrity level.
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
