# Build environment for whisper-rs-sys (whisper.cpp) on Windows.
#
# - CMAKE: whisper.cpp builds via CMake. This points at the CMake bundled with
#   Visual Studio 2022 Build Tools so it does not need to be on PATH. Adjust
#   if your CMake lives elsewhere.
# - LIBCLANG_PATH: whisper-rs-sys runs bindgen at build time, which needs
#   libclang. (Its bundled fallback bindings are Linux-generated and do not
#   compile against MSVC — verified empirically, see PHASE2 notes.) This
#   points at the per-user `pip install libclang` wheel; if you have a full
#   LLVM install instead, use e.g. 'C:\Program Files\LLVM\bin'.
[env]
CMAKE = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
LIBCLANG_PATH = 'C:\Users\manee\AppData\Local\Programs\Python\Python311\Lib\site-packages\clang\native'
